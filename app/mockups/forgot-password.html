<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password · invest-tax</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<div class="auth-shell" style="grid-template-columns:1fr;">
  <div class="auth-card mx-auto">
    <div class="flex items-center gap-2.5 mb-8">
      <div class="sidebar-mark">IT</div>
      <span class="font-semibold">invest-tax</span>
    </div>

    <div id="form-state">
      <h1 class="text-xl font-bold mb-1">Forgot your password?</h1>
      <p class="text-sm mb-6" style="color:var(--muted-foreground)">Enter your email and we'll send you a reset link.</p>

      <form class="space-y-4" onsubmit="event.preventDefault(); document.getElementById('form-state').classList.add('hidden'); document.getElementById('sent-state').classList.remove('hidden');">
        <div class="field">
          <label class="field-label">Email</label>
          <input type="email" class="input" placeholder="you@example.com" value="petros@hosperly.com" required />
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Send reset link</button>
      </form>
    </div>

    <div id="sent-state" class="hidden">
      <div class="icon-wrap mb-3" style="margin:0 0 .9rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
      </div>
      <h1 class="text-xl font-bold mb-1">Check your email</h1>
      <p class="text-sm mb-6" style="color:var(--muted-foreground)">We sent a password reset link to <strong>petros@hosperly.com</strong>. The link expires in 60 minutes.</p>
      <a href="reset-password.html" class="btn btn-outline w-full">Open reset link (demo)</a>
    </div>

    <p class="text-xs text-center mt-6" style="color:var(--muted-foreground)">
      <a href="login.html" class="link">Back to sign in</a>
    </p>
  </div>
</div>
</body>
</html>
