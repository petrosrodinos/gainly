<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password · invest-tax</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<div class="auth-shell" style="grid-template-columns:1fr;">
  <div class="auth-card mx-auto">
    <div class="flex items-center gap-2.5 mb-8">
      <div class="sidebar-mark">IT</div>
      <span class="font-semibold">invest-tax</span>
    </div>

    <h1 class="text-xl font-bold mb-1">Set a new password</h1>
    <p class="text-sm mb-6" style="color:var(--muted-foreground)">Choose a strong password for petros@hosperly.com.</p>

    <form class="space-y-4" onsubmit="event.preventDefault(); window.location.href='login.html';">
      <div class="field">
        <label class="field-label">New password</label>
        <input type="password" class="input" placeholder="At least 8 characters" required />
      </div>
      <div class="field">
        <label class="field-label">Confirm new password</label>
        <input type="password" class="input" placeholder="Repeat password" required />
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg">Update password</button>
    </form>

    <p class="text-xs text-center mt-6" style="color:var(--muted-foreground)">
      <a href="login.html" class="link">Back to sign in</a>
    </p>
  </div>
</div>
</body>
</html>
